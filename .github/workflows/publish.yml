name: 🚀 Publish

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  release:
    name: 📋 Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7.0.1

      - name: 🏷️ Set version
        id: version
        # get version from ref if trigger by tag or from package.json
        run: |
          if [[ ${{ github.ref }} == refs/tags/* ]]; then
            version=${{ github.ref_name }}
          else
            version=$(jq -r .version package.json)
          fi
          echo "version=${version}" >> $GITHUB_OUTPUT

      - name: 📝 Update CHANGELOG
        id: changelog
        uses: requarks/changelog-action@v1.10.3
        with:
          token: ${{ github.token }}
          tag: ${{ steps.version.outputs.version }}
          excludeTypes: build,docs,other,style
          writeToFile: false

      - name: 📦 Create Release
        uses: ncipollo/release-action@v1.21.0
        with:
          allowUpdates: true
          draft: false
          tag: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.changes }}

  publish:
    name: 🌐 Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for npm provenance attestation.
      id-token: write
      # Scoped down from the default (write) for least-privilege publishing.
      contents: read

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7.0.1

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 'lts/*'
          package-manager-cache: false

      - name: ⚙️ Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🧰 Release on npm
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set access public && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}